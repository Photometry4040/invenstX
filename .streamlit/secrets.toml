# Streamlit Secrets Configuration
# This file should NOT be committed to Git
# Copy this to your Streamlit Cloud deployment settings

[api_keys]
# Optional: Add your API keys here
# alpha_vantage = "your_key_here"
# finnhub = "your_key_here"
# news_api = "your_key_here"

[database]
# Optional: Database configuration
url = "sqlite:///invenstx.db"

[security]
# Generate a secure secret key for sessions
secret_key = "invenstx_secret_key_2024"

[features]
# Feature flags
enable_paper_trading = true
enable_ensemble = true
enable_realtime = false
enable_gpu = false

[limits]
# Rate limiting
max_requests_per_minute = 60
max_data_points = 5000
max_backtest_days = 365