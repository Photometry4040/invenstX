# Streamlit Configuration for InvenstX

[server]
port = 8501
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 200
enableWebsocketCompression = false

[browser]
gatherUsageStats = false
serverAddress = "0.0.0.0"
serverPort = 8501

[theme]
# Dark theme optimized for trading dashboard
primaryColor = "#FF6B6B"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#262730"
textColor = "#FAFAFA"
font = "sans serif"

[runner]
magicEnabled = true
installTracer = false
fixMatplotlib = true
postScriptGC = true
fastReruns = true

[client]
caching = true
displayEnabled = true
showErrorDetails = true

[logger]
level = "info"
messageFormat = "%(asctime)s %(message)s"

[deprecation]
showPyplotGlobalUse = false